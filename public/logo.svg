<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#adff2f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#07080a" stroke="#27272a" stroke-width="8" />
  <!-- Circuit Nodes & Vector Grid -->
  <path d="M 96 160 H 192 V 256 H 320 V 352 H 416" fill="none" stroke="#27272a" stroke-width="6" stroke-dasharray="8 8" />
  <circle cx="192" cy="256" r="10" fill="#38bdf8" />
  <circle cx="320" cy="256" r="10" fill="#adff2f" />
  <!-- Center Monogram 'J' with Neon Glow -->
  <text x="256" y="340" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="280" font-weight="900" fill="#adff2f" text-anchor="middle" filter="url(#neonBlur)">J</text>
  <!-- Technical Perimeter Sub-badge -->
  <text x="256" y="445" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#71717a" text-anchor="middle" letter-spacing="8">JCRF LABS</text>
</svg>
