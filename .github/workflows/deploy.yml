name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Search Engines & AI Bots via IndexNow
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "byte-od.github.io",
              "key": "97f2b184918e47268d37449265e3170a",
              "keyLocation": "https://byte-od.github.io/97f2b184918e47268d37449265e3170a.txt",
              "urlList": [
                "https://byte-od.github.io/",
                "https://byte-od.github.io/llms.txt",
                "https://byte-od.github.io/llms-full.txt",
                "https://byte-od.github.io/ai-index.json",
                "https://byte-od.github.io/sitemap.xml"
              ]
            }'
